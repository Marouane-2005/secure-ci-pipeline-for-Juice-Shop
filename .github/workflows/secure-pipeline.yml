name: Secure CI Pipeline (OWASP Juice Shop)

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  # =========================================================
  # 0. BUILD : construit l'image Docker depuis LE FORK (une seule fois)
  # =========================================================
  build:
    name: Build image (from this repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t juice-shop-fork:latest .

      - name: Save image as tar
        run: docker save juice-shop-fork:latest -o juice-shop-fork.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-image
          path: juice-shop-fork.tar
          retention-days: 1


  # =========================================================
  # 1. SECRET SCANNING
  # =========================================================
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true


  # =========================================================
  # 2. SAST
  # =========================================================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    container:
      image: returntocorp/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/javascript \
            --json \
            --output semgrep-results.json .
        continue-on-error: true

      - name: Upload SAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: semgrep-results.json


  # =========================================================
  # 3. SCA
  # =========================================================
  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts
        continue-on-error: true

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "juice-shop"
          path: "."
          format: "JSON"
          out: "reports"
          args: >
            --noupdate
            --exclude "**/test/files/**"

      - name: Upload SCA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: ${{ github.workspace }}/reports/dependency-check-report.json


  # =========================================================
  # 4. CONTAINER SECURITY (image construite depuis le fork)
  # =========================================================
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-image

      - name: Load image
        run: docker load -i juice-shop-fork.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "juice-shop-fork:latest"
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
        continue-on-error: true

      - name: Upload container scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-results
          path: trivy-results.json


  # =========================================================
  # 5. DAST (application construite depuis le fork)
  # =========================================================
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: juice-shop-image

      - name: Load image
        run: docker load -i juice-shop-fork.tar

      - name: Start Juice Shop (built from this repository)
        run: |
          docker run -d \
            --name juice-shop \
            -p 3000:3000 \
            juice-shop-fork:latest

      - name: Wait for Juice Shop
        run: |
          echo "Waiting for Juice Shop..."

          for i in {1..30}; do
            if curl -fs http://localhost:3000 > /dev/null; then
              echo "Juice Shop is ready."
              exit 0
            fi

            echo "Attempt $i/30..."
            sleep 2
          done

          echo "Juice Shop failed to start."
          docker logs juice-shop
          exit 1

      - name: Prepare ZAP results directory
        run: |
          mkdir -p zap-results
          chmod 777 zap-results

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm \
            --network host \
            -v "${{ github.workspace }}/zap-results:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:3000 \
            -J zap-report.json \
            -r zap-report.html \
            -m 5
        continue-on-error: true

      - name: Show ZAP results
        if: always()
        run: |
          echo "===== ZAP RESULTS ====="
          ls -lah zap-results || true

          if [ -f zap-results/zap-report.json ]; then
            echo "ZAP JSON report found."
          else
            echo "WARNING: ZAP JSON report not found."
          fi

      - name: Upload DAST results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: zap-results/


  # =========================================================
  # 6. CENTRALIZED QUALITY GATE
  # =========================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    needs:
      - secret-scan
      - sast
      - sca
      - container-scan
      - dast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Le pattern exclut l'artifact volumineux "juice-shop-image"
      - name: Download scan results
        uses: actions/download-artifact@v4
        with:
          pattern: "*-results"
          path: scan-results

      - name: Show downloaded scan results
        run: |
          echo "===== DOWNLOADED SCAN RESULTS ====="
          find scan-results -maxdepth 3 -type f -print || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python3 -m py_compile quality_gate.py

      - name: Evaluate Quality Gate
        run: |
          python3 quality_gate.py \
            --results-dir scan-results \
            --exceptions security-exceptions.json

      - name: Post summary
        if: always()
        run: |
          if [ -f quality_gate_summary.md ]; then
            cat quality_gate_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
